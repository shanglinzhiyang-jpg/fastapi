<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<title>ドット芸能界&amp;政治界　ライフスペシャル</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="screen"><canvas id="game" width="640" height="360" aria-label="ゲーム画面"></canvas></div>
  <div id="rotate" role="note">スマホを横向きにすると、<br>画面が大きく見やすくなります<span>（タップでとじる）</span></div>
  <div id="pad" aria-hidden="true">
    <div id="dpad"><div class="arrow up">▲</div><div class="arrow left">◀</div><div class="arrow right">▶</div><div class="arrow down">▼</div></div>
    <div id="sys">
      <button id="fs" type="button" tabindex="-1" aria-label="全画面"><svg viewBox="0 0 10 10" aria-hidden="true" fill="currentColor"><path class="fs-enter" d="M0 0h4v1H1v3H0zM6 0h4v4H9V1H6zM0 6h1v3h3v1H0zM9 6h1v4H6V9h3z"/><path class="fs-exit" d="M3 0h1v4H0V3h3zM6 0h1v3h3v1H6zM0 6h4v4H3V7H0zM6 6h4v1H7v3H6z"/></svg></button>
      <button type="button" tabindex="-1" data-k="menu">MENU</button>
    </div>
    <div id="ab"><button type="button" tabindex="-1" class="btn b" data-k="b">B</button><button type="button" tabindex="-1" class="btn a" data-k="a">A</button></div>
  </div>
  <div id="help">Aボタン（決定）: Z / Space / Enter　Bボタン（キャンセル・ダッシュ）: X / Shift　移動: 矢印 / WASD　メニュー: Esc / C　音: M</div>
</div>
<div id="bootfail" role="alert" hidden>ゲームを読み込めませんでした…<span>ページを再読み込みしてください。直らないときは、ブラウザを最新にしてお試しください。</span></div>
<script>
// Boot watchdog (not a module, so it runs even when the module graph cannot load):
// js/main.js sets window.__game as soon as it starts and from then on shows its own
// errors on the canvas. If it never starts (a file 404s or does not parse, or the
// browser cannot run ES modules), say so instead of leaving a black box.
(function () {
  var t0 = Date.now();
  function fail() { if (window.__game) return; var el = document.getElementById('bootfail'); if (el) el.hidden = false; }
  window.__bootFail = fail;
  window.addEventListener('error', function () { if (!window.__game) setTimeout(fail, 1500); });
  var iv = setInterval(function () {
    if (window.__game) { clearInterval(iv); var el = document.getElementById('bootfail'); if (el) el.hidden = true; return; }
    if (Date.now() - t0 > 12000) fail();
  }, 500);
})();
</script>
<script type="module" src="js/main.js" onerror="window.__bootFail && window.__bootFail()"></script>
</body>
</html>
