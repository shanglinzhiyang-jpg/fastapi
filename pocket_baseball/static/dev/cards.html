<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><base href="/">
<title>cards dev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=M+PLUS+1p:wght@800;900&display=swap">
<style>body{margin:0;background:#111;display:flex;flex-wrap:wrap;gap:10px;padding:10px;align-content:flex-start}canvas{border-radius:10px}</style>
</head><body>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/npb.js"></script>
<script src="js/rosters2004.js"></script>
<script src="js/field.js"></script>
<script src="js/pitch.js"></script>
<script src="js/render.js"></script>
<script src="vendor/three.min.js"></script>
<script src="js/three/model.js"></script>
<script src="js/three/anim.js"></script>
<script src="js/three/gear.js"></script>
<script src="js/three/human.js"></script>
<script src="js/three/stadium.js"></script>
<script src="js/three/view.js"></script>
<script src="js/three/portrait.js"></script>
<script src="js/cards.js"></script>
<script>
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'bg';
const W = Number(q.get('w') || 300);
(async () => {
  await document.fonts.ready;
  if (mode === 'bg') {
    const rows = [['S', 'c'], ['A', 'g'], ['B', 'd'], ['C', 't'], ['D', 'l'], ['E', 'h']];
    for (const [rk, id] of rows) {
      const c = document.createElement('canvas');
      c.width = W; c.height = W * 4 / 3;
      document.body.appendChild(c);
      PB.Cards.background(c.getContext('2d'), c.width, c.height, PB.Cards.theme(rk, PB.D.teamDef(id)), 7 + rk.charCodeAt(0));
    }
  } else {
    // 実在選手のカード: picks=チームID:名前,...
    const picks = (q.get('picks') || 'd:ウッズ,c:ラロッカ,s:岩村,t:井川').split(',');
    const teams = {};
    const jobs = [];
    for (const pk of picks) {
      const [tid, nm] = pk.split(':');
      const team = teams[tid] || (teams[tid] = PB.D.generateTeam(PB.D.teamDef(tid)));
      const p = team.players.find((x) => x.name === nm || x.full === nm) || team.players[0];
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = Math.round(W * 4 / 3);
      document.body.appendChild(cv);
      const ov = PB.Cards.overall(p);
      const th = PB.Cards.theme(ov.rank, team);
      const yaw = q.get('yaw') != null ? Number(q.get('yaw')) : undefined;
      jobs.push(PB.Portraits.get(p, team, { rim: th.ray, yaw }).then((img) => PB.Cards.draw(cv, p, team, img, {}), (e) => { console.error(e); return PB.Cards.draw(cv, p, team, null, {}); }));
    }
    await Promise.all(jobs);
  }
  window.__ready = true;
})();
</script></body></html>
