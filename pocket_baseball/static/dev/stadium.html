<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 球場確認</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100%;height:100%}</style>
</head><body>
<script src="../vendor/three.min.js"></script>
<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/field.js"></script>
<script src="../js/three/stadium.js"></script>
<script>
const q = new URLSearchParams(location.search);
const T = THREE;
const W = innerWidth, H = innerHeight;
const r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
r.outputColorSpace = T.SRGBColorSpace; r.toneMapping = T.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new T.Scene();
const teams = PB.D.TEAMS;
const home = teams[Number(q.get('h') || 1)], away = teams[Number(q.get('a') || 0)];
const st = PB.Stadium3D.build({ home, away, night: q.get('night') !== '0', quality: 'high' });
scene.add(st.group); scene.fog = st.fog;
r.toneMappingExposure = st.exposure;
const INFO = ({ inning: 7, top: false, b: 2, s: 1, o: 1, speed: 151, pitch: 'ストレート', batter: '山田 太郎', batLine: '.312  24本  78打点', pitcher: '佐藤 一', pitLine: '8勝3敗 防2.41',
  line: { away: [0, 1, 0, 0, 2, 0, 0], home: [1, 0, 0, 3, 0, 0] }, away: { short: away.short, R: 3, H: 7, E: 1, lineup: [] }, home: { short: home.short, R: 4, H: 9, E: 0, lineup: [] }, batSide: 'home', batIdx: 3 });
st.board.draw(INFO);
const V = PB.Stadium3D.V;
const presets = {
  bat: { pos: [0, -4.2, 1.3], tgt: [0, 18.44, 0.95], fov: 29 },
  field: { pos: [0, -40, 74], tgt: [0, 50, 0], fov: 50 },
  land: { pos: [0, -50, 42], tgt: [0, 56, 0], fov: 40 },
  home: { pos: [6, -8, 3], tgt: [0, 0, 0], fov: 50 },
  mound: { pos: [8, 8, 4], tgt: [0, 18, 0], fov: 50 },
  of: { pos: [0, 40, 12], tgt: [0, 120, 8], fov: 60 },
  stands: { pos: [-30, 30, 20], tgt: [-90, 40, 10], fov: 60 },
  air: { pos: [0, -120, 160], tgt: [0, 40, 0], fov: 50 },
};
const p = presets[q.get('v') || 'bat'];
const cam = new T.PerspectiveCamera(p.fov, W / H, 0.1, 4000);
cam.position.copy(V(...p.pos)); cam.lookAt(V(...p.tgt));
st.focusShadow(0, 20, 40);
st.update(0.5);
document.fonts.ready.then(() => { st.board.last = ''; st.board.draw(INFO); r.render(scene, cam); window.__ready = true; });
r.render(scene, cam);
setTimeout(() => (window.__ready = true), 4000);
</script></body></html>
