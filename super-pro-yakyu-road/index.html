<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<title>スーパープロ野球ロード</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="screen"><canvas id="game" width="960" height="540" aria-label="ゲーム画面"></canvas></div>
  <div id="pad" aria-hidden="true">
    <div id="dpad"><div class="arrow up" data-k="up">▲</div><div class="arrow left" data-k="left">◀</div><div class="arrow right" data-k="right">▶</div><div class="arrow down" data-k="down">▼</div></div>
    <div id="sys"><button type="button" tabindex="-1" data-k="start">START</button></div>
    <div id="ab"><button type="button" tabindex="-1" class="btn b" data-k="b">B</button><button type="button" tabindex="-1" class="btn a" data-k="a">A</button></div>
  </div>
  <div id="help">A：決定・打つ・投げる（Z / Space / Enter）　B：もどる・強振（X / Shift）　移動：矢印 / WASD　START：メニュー（Esc / C）</div>
</div>
<noscript><div style="position:fixed;left:0;right:0;top:12%;margin:0 auto;max-width:520px;padding:16px 20px;background:#0b1a33;color:#fff;border:2px solid #ffd23f;font:16px/1.7 sans-serif;text-align:center;z-index:99">JavaScriptが動いていないため、ゲームが始まりません。<br>ファイルのプレビュー画面ではなく、Safari や Chrome で開いてください。</div></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
