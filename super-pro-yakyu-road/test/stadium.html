<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="gl" width="1280" height="720" style="width:1280px;height:720px"></canvas>
<script type="module">
import { World } from '../js/gfx/world.js';
const w = new World(document.getElementById('gl'));
w.resize(1280, 720, 1);
window.__w = w;
window.__shot = (view, opt, night) => { if (night !== undefined && night !== w.night) w.build({ night, c1: '#0a55a8', c2: '#ffffff' }); w.setView(view, opt || {}); w.render(); return true; };
window.__ready = true;
</script></body></html>
